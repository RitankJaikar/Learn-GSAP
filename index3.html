<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GSAP ScrollTrigger Master Notes</title>
    <style>
      body {
        margin: 0;
        background-color: #111;
        color: #fff;
        font-family: sans-serif;
        overflow-x: hidden;
      }

      .spacer {
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 2rem;
        color: #555;
      }

      #page3 {
        height: 100vh;
        background-color: #1a1a1a;
        display: flex;
        justify-content: center;
        align-items: center;
        position: relative;
      }

      .box {
        width: 150px;
        height: 150px;
        background-color: #00ff66;
        border-radius: 12px;
        display: flex;
        justify-content: center;
        align-items: center;
        color: #000;
        font-weight: bold;
        transition: background-color 0.3s ease;
      }

      /* Toggled by GSAP ScrollTrigger */
      .box.active {
        background-color: #00b3ff;
        box-shadow: 0 0 20px #00b3ff;
      }
    </style>
  </head>
  <body>
    <div class="spacer">Scroll Down 👇</div>
    <div class="spacer">Keep Scrolling...</div>

    <div id="page3">
      <div class="box">GSAP BOX</div>
    </div>

    <div class="spacer">Scroll Back Up 👆</div>
    <div class="spacer">End of Page</div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>

    <script>
      document.addEventListener("DOMContentLoaded", (event) => {
        // Register ScrollTrigger Plugin
        gsap.registerPlugin(ScrollTrigger);

        // Initialize Timeline with ScrollTrigger Configurations
        let timeline = gsap.timeline({
          paused: true,
          defaults: {
            ease: "Power1.easeInOut",
          },
          scrollTrigger: {
            trigger: ".box",
            scroller: "body",
            start: "top center",
            end: "bottom 0%",
            toggleActions: "play pause resume reset",
            toggleClass: { targets: ".box", className: "active" },
            markers: true,
            scrub: true,
            pin: true,

            // Lifecycle Event Callbacks
            onEnter: () => {
              console.log("onEnter");
            },
            onLeave: () => {
              console.log("onLeave");
            },
            onEnterBack: () => {
              console.log("onEnterBack");
            },
            onLeaveBack: () => {
              console.log("onLeaveBack");
            },
            onUpdate: () => {
              console.log("onUpdate");
            },
            onToggle: () => {
              console.log("onToggle");
            },
            onRefresh: () => {
              console.log("onRefresh");
            },
          },
        });

        // Timeline Animation Tweens
        timeline.to(".box", { rotation: 90, x: 300, duration: 2 });
        timeline.to(".box", { rotation: 180, y: 100, duration: 1 });
        timeline.to(".box", { rotation: 90, x: 0, duration: 2 });
        timeline.to(".box", { rotation: 0, y: 0, duration: 1 });
      });
    </script>
  </body>
</html>
