<!-- Example HTML -->

<div class="switcher-section relative">
  <!-- height calc via js -->
  <div
    class="switcher-wrap relative"
    style="height: 100vh; position: sticky; top: 0; overflow: hidden"
  >
    <!-- full/main section -->
    <div class="switcher-stack-item">
      <!-- main parent -->
      <div class="switcher-text-item">
        <!-- text on which animation has to perform -->
        Text 1.1
      </div>
      <div class="switcher-text-item">Text 1.2</div>
      <div class="switcher-text-item">Text 1.3</div>
    </div>

    <div class="switcher-stack-item">
      <!-- main parent -->
      <div>
        <div class="switcher-line-item"></div>
        <!-- the line, 0 to 100%, left to right, ease-in-out -->
        <div class="switcher-text-item">Text 2.1</div>
      </div>
      <div>
        <div class="switcher-line-item"></div>
        <div class="switcher-text-item">Text 2.2</div>
      </div>
      <div>
        <div class="switcher-line-item"></div>
        <div class="switcher-text-item">Text 2.3</div>
      </div>
    </div>

    <div class="switcher-stack-item">
      <!-- main parent -->
      <div class="switcher-text-item">Text 3.1</div>
      <div class="switcher-text-item">Text 3.2</div>
      <div class="switcher-text-item">Text 3.3</div>
    </div>
  </div>
</div>
