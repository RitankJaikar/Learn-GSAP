<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GSAP Multi-Item Switcher</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="spacer">Scroll to start</div>

    <!-- Main section using your exact provided HTML layout -->
    <section class="switcher-section" id="switcher-section">
      <!-- Column 1 -->
      <div class="switcher-stack-item">
        <div class="switcher-text-item active">Text 1.1</div>
        <div class="switcher-text-item">Text 1.2</div>
        <div class="switcher-text-item">Text 1.3</div>
        <div class="switcher-text-item">Text 1.4</div>
      </div>

      <!-- Column 2 (Includes line items) -->
      <div class="switcher-stack-item">
        <div class="active">
          <div class="switcher-line-item"></div>
          <div class="switcher-text-item">Text 2.1</div>
        </div>
        <div>
          <div class="switcher-line-item"></div>
          <div class="switcher-text-item">Text 2.2</div>
        </div>
        <div>
          <div class="switcher-line-item"></div>
          <div class="switcher-text-item">Text 2.3</div>
        </div>
        <div>
          <div class="switcher-line-item"></div>
          <div class="switcher-text-item">Text 2.4</div>
        </div>
      </div>

      <!-- Column 3 -->
      <div class="switcher-stack-item">
        <div class="switcher-text-item active">Text 3.1</div>
        <div class="switcher-text-item">Text 3.2</div>
        <div class="switcher-text-item">Text 3.3</div>
        <div class="switcher-text-item">Text 3.4</div>
      </div>
    </section>

    <div class="spacer">Next section</div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/ScrollTrigger.min.js"></script>
    <script src="script.js"></script>
  </body>
</html>
