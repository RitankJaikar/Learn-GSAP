<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="utf-8" />
    <title>Swiper Demo</title>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1"
    />

    <script src="https://cdn.tailwindcss.com"></script>

    <style>
      swiper-container {
        width: 100%;
        height: 100%;

        /* Isse slider ek smooth, premium aur subtle tarike se slide hoga */
        --swiper-wrapper-transition-timing-function: cubic-bezier(
          0.25,
          1,
          0.5,
          1
        );
      }

      /* Moving all swiper-slide styles back to CSS block */
      swiper-slide {
        align-self: center;
        height: 80vh !important;
        border-radius: 12px;
        text-align: center;
        font-size: 18px;
        width: max-content;
      }

      /* swiper-slide {
        width: 80vw;
      }

      swiper-slide:nth-child(2n) {
        width: 60vw;
      }

      swiper-slide:nth-child(3n) {
        width: 40vw;
      } */

      swiper-slide:nth-child(odd) {
        background: linear-gradient(135deg, #1a1a1a, #222);
        border: 1px solid #333;
      }

      swiper-slide:nth-child(even) {
        background: linear-gradient(135deg, #111, #1e1e2f);
        border: 1px solid #f03;
      }

      swiper-slide {
        opacity: 0.5;
        transform: scale(0.8);
        transition:
          transform 0.5s ease-out,
          opacity 0.5s ease-out;
      }
      swiper-slide.swiper-slide-active {
        opacity: 1;
        transform: scale(1);
      }
    </style>
  </head>

  <body
    class="bg-black text-white font-sans m-0 p-0 overflow-x-hidden h-full relative"
  >
    <div class="h-screen flex justify-center items-center text-2xl">
      Scroll Down
    </div>

    <div class="h-[400vh] relative">
      <div class="h-screen sticky top-0 flex items-center overflow-hidden">
        <swiper-container
          class="mySwiper"
          space-between="40"
          slides-per-view="auto"
          centered-slides="false"
          pagination="false"
          pagination-clickable="false"
          mousewheel="true"
          mousewheel-release-on-edges="true"
          grab-cursor="true"
          loop="true"
          speed="800"
        >
          <swiper-slide><div style="width: 50vw"></div></swiper-slide>
          <swiper-slide><div style="width: 40vw"></div></swiper-slide>
          <swiper-slide><div style="width: 60vw"></div></swiper-slide>
          <swiper-slide><div style="width: 90vw"></div></swiper-slide>
          <swiper-slide><div style="width: 80vw"></div></swiper-slide>
          <swiper-slide style="opacity: 0; width: 50%"
            >Dummy Empty</swiper-slide
          >
        </swiper-container>
      </div>
    </div>

    <!-- Multiple swiper example -->
    <swiper-container
      class="mySwiper3"
      space-between="30"
      pagination="true"
      pagination-clickable="true"
    >
      <swiper-slide>Slide 1</swiper-slide>
      <swiper-slide>Slide 2</swiper-slide>
      <swiper-slide>Slide 3</swiper-slide>
    </swiper-container>

    <div class="h-screen flex justify-center items-center text-2xl">
      Footer Content
    </div>

    <script src="https://cdn.jsdelivr.net/npm/swiper@12/swiper-element-bundle.min.js"></script>

    <script>
      const swiperEl = document.querySelector("swiper-container");
      swiperEl.style.pointerEvents = "none"; // Initial State Dead Lock

      const observer = new IntersectionObserver(
        ([entry]) => {
          // Jab poora container 100% viewport me enter ho jayega tabhi interaction allow hogi
          swiperEl.style.pointerEvents = entry.isIntersecting ? "auto" : "none";
        },
        { threshold: 1.0 },
      );

      observer.observe(swiperEl);
    </script>
  </body>
</html>
